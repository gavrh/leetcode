name: Sync LeetCode

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Rescan the entire submission history
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRFTOKEN: ${{ secrets.LEETCODE_CSRFTOKEN }}
          CF_CLEARANCE: ${{ secrets.CF_CLEARANCE }}
        run: python .scripts/leetcode_sync.py ${{ inputs.full && '--full' || '' }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: sync leetcode solutions"
            git push
          fi
